spring.application.name=backend
server.port=8080
server.forward-headers-strategy=framework

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:netgraph}
# Let Spring Boot auto-detect driver based on URL
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:password}
# Let Spring Boot auto-detect dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
springdoc.swagger-ui.path=/swagger-ui.html

# Redis Cache Config
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# JWT
app.jwt.secret=${JWT_SECRET:netgraph-super-secret-key-must-be-at-least-256-bits-long!}
app.jwt.expiration=86400000



logging.level.org.springframework.web=WARN
logging.level.com.netgraph.backend=INFO

# Actuator — expose health, info, metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=NetGraph
info.app.version=2.0.0
info.app.description=Enterprise-Grade Social Networking Platform

# Email (optional — set SMTP env vars to enable)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
